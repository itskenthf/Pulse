name: Refresh widget cache

# Vercel's Hobby tier only allows daily cron jobs, too infrequent for the
# per-widget refresh intervals in docs/PROJECT_REFERENCE.md §4. The
# reference doc explicitly allows swapping Vercel Cron for GitHub Actions
# without changing any widget — see docs/DECISIONS.md.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        # -L: without this, curl doesn't follow a redirect, and --fail
        # only fails on 4xx/5xx — a stale PULSE_URL pointing at an old
        # Vercel domain alias would "succeed" on the redirect response
        # itself without ever reaching /api/cron. PULSE_URL is a secret,
        # not a variable, so it's masked in logs: unlike variables,
        # GitHub Actions doesn't redact variables, and this repo is
        # public, so a variable's value is plaintext-visible to anyone
        # in every run's log.
        run: |
          curl --fail --silent --show-error -L \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PULSE_URL}/api/cron"
        env:
          PULSE_URL: ${{ secrets.PULSE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
